[project]
name = "tradepulse-ai-hackathon"
version = "0.1.0"
description = "Isolated synthetic TradePulse AI hackathon backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.test-artifacts/pytest -ra"
filterwarnings = ["error"]
